<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卸载意见反馈 — 微软 Rewards 自动搜索助手</title>
  <meta name="description" content="微软 Rewards 自动搜索助手 卸载意见反馈收集页。感谢您的使用与建议。">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-light: rgba(56, 189, 248, 0.1);
      --accent: #38bdf8;
      --border-color: #334155;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #38bdf8;
        --primary-hover: #7dd3fc;
        --primary-light: rgba(56, 189, 248, 0.1);
        --accent: #38bdf8;
        --border-color: #334155;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--primary-hover);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.3s;
    }
    [data-theme="dark"] header, @media (prefers-color-scheme: dark) {
      header {
        background-color: rgba(15, 23, 42, 0.85);
      }
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .theme-toggle-btn:hover {
      background-color: var(--primary-light);
    }

    /* Content Area */
    .feedback-section {
      padding: 3rem 0;
    }

    .feedback-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .feedback-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .feedback-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .radio-item:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .radio-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .radio-item span {
      font-size: 1rem;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
      border: none;
      width: 100%;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      opacity: 0.92;
      box-shadow: var(--shadow-lg);
    }

    .github-link-box {
      margin-top: 2rem;
      padding: 1rem 1.25rem;
      background-color: var(--primary-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: modalSlide 0.3s ease-out;
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .modal-desc {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .modal-close-btn {
      width: auto;
      padding: 0.65rem 1.75rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 2rem 0;
      background-color: var(--card-bg);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="nav-wrapper">
      <a href="index.html" class="logo">
        <div class="logo-icon">M</div>
        <span>微软 Rewards 自动搜索助手</span>
      </a>
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换主题">
        <span id="themeIcon">🌙</span> <span id="themeText">深色</span>
      </button>
    </div>
  </header>

  <!-- Feedback Content -->
  <div class="container">
    <section class="feedback-section">
      <div class="feedback-header">
        <h1 class="feedback-title">卸载意见反馈</h1>
        <p class="feedback-subtitle">很遗憾看到您选择卸载，感谢您提供宝贵意见，帮助我们改进产品</p>
      </div>

      <div class="card">
        <form id="feedbackForm">
          <div class="form-group">
            <label class="form-label">请问您选择卸载的主要原因是？</label>
            <div class="radio-group">
              <label class="radio-item">
                <input type="radio" name="reason" value="功能不如预期" required>
                <span>功能不如预期</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="reason" value="遇到错误/Bug">
                <span>遇到错误/Bug</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="reason" value="担心账号安全">
                <span>担心账号安全</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="reason" value="不再需要 Rewards 积分">
                <span>不再需要 Rewards 积分</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="reason" value="其他">
                <span>其他原因</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="details">详细说明或改进建议（选填）</label>
            <textarea id="details" name="details" placeholder="请在此输入具体的改进建议或您遇到的异常情况..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary">提交反馈</button>
        </form>

        <div class="github-link-box">
          如果是使用中遇到问题，您也可以直接在 
          <a href="https://github.com/3y3y3y-huaiji/MicrosoftRewardsWebsite/issues" target="_blank" rel="noopener">GitHub Issues</a> 
          提交 Bug 或寻找帮助。
        </div>
      </div>
    </section>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-icon">🎉</div>
      <h2 class="modal-title">感谢您的反馈！</h2>
      <p class="modal-desc">您的意见已成功接收，我们将持续改进“微软 Rewards 自动搜索助手”。祝您生活愉快！</p>
      <button class="btn btn-primary modal-close-btn" id="closeModalBtn">返回首页</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>Copyright © 2026 3y3y3y-huaiji. All rights reserved.</p>
      <p style="margin-top: 0.5rem; font-size: 0.85rem;">Licensed under the Apache License, Version 2.0.</p>
    </div>
  </footer>

  <script>
    // Theme toggle
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function setTheme(isDark) {
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
        themeText.textContent = '浅色';
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeIcon.textContent = '🌙';
        themeText.textContent = '深色';
        localStorage.setItem('theme', 'light');
      }
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme(true);
    } else {
      setTheme(false);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      setTheme(!isDark);
    });

    // Form submit & modal
    const feedbackForm = document.getElementById('feedbackForm');
    const confirmModal = document.getElementById('confirmModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    feedbackForm.addEventListener('submit', (e) => {
      e.preventDefault();
      confirmModal.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
      confirmModal.classList.remove('active');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
